name: Profile art

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/profile-art.yml, README.md]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Plate read of contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 assets/plate.py ${{ github.repository_owner }} assets/plate.svg

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/plate.svg
          git commit -m "chore: refresh profile art" && git push || echo "no changes"
