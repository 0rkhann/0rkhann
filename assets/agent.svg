<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 314" width="1200" height="314" role="img" aria-label="Animated replay of the chemlit agent pipeline: expand, search, rerank, read, resolve, answer.">
  <style>
    .mono { font:400 16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .dim { fill:#484f58; } .verb { fill:#4FD1C5; font-weight:700; } .txt { fill:#c9d1d9; } .ok { fill:#4FD1C5; font-weight:700; }
    .q { fill:#e6edf3; } .p { fill:#4FD1C5; } .title { font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#8b949e; }
    .step, .ok { opacity:0; animation:show 14s ease-out infinite backwards; }
    .caret { fill:#4FD1C5; animation:blink 1s steps(1) infinite; }
    @keyframes show { 0% { opacity:0; transform:translateX(-6px); } 3%, 85% { opacity:1; transform:none; } 90%, 100% { opacity:0; } }
    @keyframes blink { 50% { opacity:0; } }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } .step, .ok { opacity:1; } }
  </style>
  <rect width="1200" height="314" rx="14" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="312" rx="13" fill="none" stroke="#21262d"/>
  <path d="M1,14 a13,13 0 0 1 13,-13 H1186 a13,13 0 0 1 13,13 V38 H1 Z" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="600" y="24" class="title" text-anchor="middle">chemlit · example run</text>
  <text x="32" y="74" class="mono"><tspan class="p">$ </tspan><tspan class="q">chemlit ask "Which covalent warheads target KRAS G12C?"</tspan><tspan class="caret"> ▍</tspan></text>
  <g class="step" style="animation-delay:1.4s"><text x="56" y="108" class="mono dim">├─</text><text x="88" y="108" class="mono verb">expand</text><text x="190" y="108" class="mono txt">plain-language rewrites, so other fields' vocabulary still matches</text></g><text x="1140" y="108" class="mono ok" text-anchor="end" style="animation-delay:2.0s">✓</text><g class="step" style="animation-delay:2.4s"><text x="56" y="138" class="mono dim">├─</text><text x="88" y="138" class="mono verb">search</text><text x="190" y="138" class="mono txt">OpenAlex · Semantic Scholar · PubMed · arXiv · SPECTER2 neighbours</text></g><text x="1140" y="138" class="mono ok" text-anchor="end" style="animation-delay:3.0s">✓</text><g class="step" style="animation-delay:3.4s"><text x="56" y="168" class="mono dim">├─</text><text x="88" y="168" class="mono verb">rerank</text><text x="190" y="168" class="mono txt">cross-encoder orders every candidate, an LLM judges relevance</text></g><text x="1140" y="168" class="mono ok" text-anchor="end" style="animation-delay:4.0s">✓</text><g class="step" style="animation-delay:4.4s"><text x="56" y="198" class="mono dim">├─</text><text x="88" y="198" class="mono verb">read</text><text x="190" y="198" class="mono txt">legal open-access full text only; retractions dropped</text></g><text x="1140" y="198" class="mono ok" text-anchor="end" style="animation-delay:5.0s">✓</text><g class="step" style="animation-delay:5.4s"><text x="56" y="228" class="mono dim">├─</text><text x="88" y="228" class="mono verb">resolve</text><text x="190" y="228" class="mono txt">OPSIN → PubChem → ChEMBL pipeline → RDKit alerts</text></g><text x="1140" y="228" class="mono ok" text-anchor="end" style="animation-delay:6.0s">✓</text><g class="step" style="animation-delay:6.4s"><text x="56" y="258" class="mono dim">├─</text><text x="88" y="258" class="mono verb">answer</text><text x="190" y="258" class="mono txt">PaperQA2 with claim-level citations, every DOI checked</text></g><text x="1140" y="258" class="mono ok" text-anchor="end" style="animation-delay:7.0s">✓</text>
</svg>
