  <style>
    .bond { fill:none; stroke:#4FD1C5; stroke-width:3; stroke-linecap:round; stroke-dasharray:120; stroke-dashoffset:120; animation:draw 18s ease-out infinite backwards; }
    .thin { stroke-width:2; stroke-opacity:.7; }
    .atom, .gen { opacity:0; animation:gen 18s ease-out infinite backwards; }
    .sym { font:700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; text-anchor:middle; }
    .smi { font:500 17px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#e6edf3; }
    .dot { fill:#1f6f6a; animation:drift ease-in-out infinite alternate; }
    .name { font:700 54px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif; fill:#e6edf3; }
    .role { font:500 24px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif; fill:#4FD1C5; letter-spacing:3px; }
    .meta { font:400 18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#8b949e; }
    .tag { font:400 20px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#e6edf3; opacity:0; animation:cycle 12s linear infinite; }
    .caret { fill:#4FD1C5; animation:blink 1s steps(1) infinite; }
    @keyframes gen { 0% { opacity:0; } 2.5%, 74% { opacity:1; } 78%, 100% { opacity:0; } }
    @keyframes draw { 0% { stroke-dashoffset:120; opacity:1; } 3%, 74% { stroke-dashoffset:0; opacity:1; } 78%, 100% { stroke-dashoffset:0; opacity:0; } }
    @keyframes drift { from { transform:translate(0,0); opacity:.25; } to { transform:translate(14px,-10px); opacity:.9; } }
    @keyframes cycle { 0% { opacity:0; } 3%, 30% { opacity:1; } 33%, 100% { opacity:0; } }
    @keyframes blink { 50% { opacity:0; } }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } .bond { stroke-dashoffset:0; } .atom, .gen, .tag:first-of-type { opacity:1; } }
  </style>
