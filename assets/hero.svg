<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Orkhan Abdullayev, Chemoinformatics and AI Engineering">
  <style>
    .bond { fill:none; stroke:#4FD1C5; stroke-width:3; stroke-linecap:round; stroke-dasharray:120; stroke-dashoffset:120; animation:draw .5s ease-out forwards; }
    .thin { stroke-width:2; opacity:.7; }
    .atom { fill:#4FD1C5; opacity:0; animation:pop .4s ease-out forwards; }
    .sym { font:700 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; text-anchor:middle; }
    .dot { fill:#1f6f6a; animation:drift ease-in-out infinite alternate; }
    .mol { animation:float 6s ease-in-out 3s infinite; }
    .name { font:700 54px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif; fill:#e6edf3; }
    .role { font:500 22px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif; fill:#4FD1C5; letter-spacing:3px; }
    .meta { font:400 16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#8b949e; }
    .tag { font:400 18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#e6edf3; opacity:0; animation:cycle 12s linear infinite; }
    .caret { fill:#4FD1C5; animation:blink 1s steps(1) infinite; }
    @keyframes draw { to { stroke-dashoffset:0; } }
    @keyframes pop { from { opacity:0; } to { opacity:1; } }
    @keyframes drift { from { transform:translate(0,0); opacity:.25; } to { transform:translate(14px,-10px); opacity:.9; } }
    @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
    @keyframes cycle { 0% { opacity:0; } 3%,30% { opacity:1; } 33%,100% { opacity:0; } }
    @keyframes blink { 50% { opacity:0; } }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } .bond { stroke-dashoffset:0; } .atom, .tag:first-of-type { opacity:1; } }
  </style>
